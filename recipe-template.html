<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Name</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="index.html">← Back to Collection</a>

    <h1 id="recipe-title">Loading...</h1>
    <img id="recipe-image" src="" alt="Recipe Image" width="300">

    <div id="metadata-box">
        <p><strong>RECIPE NAME:</strong> <span id="recipe-name">Loading...</span></p>
        <p><strong>INGREDIENTS:</strong> <span id="recipe-ingredients">Loading...</span></p>
        <p><strong>COOKING TIME (MINUTES):</strong> <span id="recipe-time">Loading...</span></p>
        <p><strong>ENERGY/DIFFICULTY (1-5):</strong> <span id="recipe-energy">Loading...</span></p>
        <p><strong>COST ESTIMATE ($-$$$):</strong> <span id="recipe-cost">Loading...</span></p>
        <p><strong>MEAL TYPE:</strong> <span id="recipe-type">Loading...</span></p>
        <p><strong>PRIMARY NUTRIENTS:</strong> <span id="recipe-nutrients">Loading...</span></p>
        <p><strong>SOURCE:</strong> <span id="recipe-source">Loading...</span></p>
    </div>

    <script src="recipe.js"></script>
</body>
</html>
